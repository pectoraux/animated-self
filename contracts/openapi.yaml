openapi: 3.1.0
info:
  title: animated-self engine
  version: 0.1.0
  description: |
    Phase 1 MVP API. Live path = pose vector over WebSocket -> THA3 -> OBS
    Virtual Camera. Async path = REST render job (Phase 3 impl; contract stable).
    Consent/liveness contract exists in Phase 1 and is enforced for custom
    characters in Phase 2.
servers:
  - url: /                   # reached via gateway with ?XTransformPort=3031

paths:
  /api/health:
    get:
      summary: Engine capability flags (CUDA present? model loaded?)
      responses: { "200": { description: ok } }

  /api/characters:
    get:
      summary: List available reference characters
      responses:
        "200":
          description: list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Character" } }

  /api/characters/{id}/thumbnail:
    get:
      summary: Character reference PNG
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: png }, "404": { description: not found } }

  /api/session/start:
    post:
      summary: Bind a character + output sink, cache the source image, open the sink
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/StartSessionRequest" } }
      responses:
        "200": { description: session, content: { application/json: { schema: { $ref: "#/components/schemas/StartSessionResponse" } } } }
        "403": { description: consent required }
        "503": { description: model not loaded }

  /api/session/{id}/stop:
    post:
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: ok } }

  /api/session/{id}/preview.jpg:
    get:
      summary: Latest rendered frame as JPEG (only when output=preview)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: jpeg }, "404": { description: not found }, "409": { description: no frame yet } }

  /ws/live:
    get:
      summary: |
        Live pose stream (WebSocket upgrade). Client sends PoseVector JSON
        frames; server emits FrameStats at most once per second.
      parameters:
        - { name: session_id, in: query, required: true, schema: { type: string } }
        - { name: XTransformPort, in: query, required: true, schema: { type: integer, enum: [3031] } }

  /api/consent/liveness/request:
    post:
      summary: Issue a randomized motion challenge
      responses: { "200": { description: challenge, content: { application/json: { schema: { $ref: "#/components/schemas/LivenessChallenge" } } } } }

  /api/consent/liveness/verify:
    post:
      summary: Verify detected challenge steps; issue consent_token bound to face hash
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/LivenessVerifyRequest" } }
      responses: { "200": { description: result, content: { application/json: { schema: { $ref: "#/components/schemas/LivenessResult" } } } } }

  /api/characters/providers:
    get:
      summary: Phase 2 — list character-generation providers (BYOK + demo)
      responses:
        "200": { description: list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GenProviderInfo" } } } } }

  /api/characters/generate:
    post:
      summary: Phase 2 — text prompt to anime character (BYOK)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/GenerateCharacterRequest" } }
      responses:
        "200": { description: character, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }
        "400": { description: unknown provider or BYOK key missing }
        "502": { description: generation failed }

  /api/characters/transfer:
    post:
      summary: Phase 2 — selfie to anime character (description-based, BYOK)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/TransferCharacterRequest" } }
      responses:
        "200": { description: character, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }
        "400": { description: unknown provider or BYOK key missing }
        "502": { description: transfer failed }

  /api/characters/upload:
    post:
      summary: Phase 2 — raw PNG upload (starts consented=false)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/UploadCharacterRequest" } }
      responses:
        "200": { description: character, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }

  /api/characters/{character_id}/consent/bind:
    post:
      summary: Phase 2 — bind a verified consent_token to a generated/uploaded character
      parameters: [ { name: character_id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ConsentBindRequest" } }
      responses:
        "200": { description: bound character, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }
        "403": { description: invalid consent token }
        "404": { description: character not found }
        "409": { description: already consent-bound to a different face }

  /api/render:
    post:
      summary: Queue an async quality-mode render (Phase 3 impl; contract stable)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/RenderRequest" } }
      responses: { "200": { description: job, content: { application/json: { schema: { $ref: "#/components/schemas/RenderJob" } } } } }

  /api/render/{job_id}:
    get:
      parameters: [ { name: job_id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: job, content: { application/json: { schema: { $ref: "#/components/schemas/RenderJob" } } } } }

  /api/voice/convert:
    post:
      summary: |
        Phase 4 — async voice conversion (file in, file out). Consent-gated
        for bound custom characters via the same _enforce_consent_gate as
        live sessions and async renders. Returns 503 when neither
        VOICE_CONVERT_CMD nor VOICE_CLOUD_PROVIDER is set — voice conversion
        is genuinely unavailable, not faked.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/VoiceConvertRequest" } }
      responses:
        "200": { description: result, content: { application/json: { schema: { $ref: "#/components/schemas/VoiceConvertResult" } } } }
        "400": { description: cloud converter requires an api_key }
        "403": { description: consent gate refused (locked char or token face_hash mismatch) }
        "502": { description: converter raised (non-zero exit, missing output, cloud API error) }
        "503": { description: voice conversion not configured (both env vars unset) }

  /api/voice/{out_id}/download:
    get:
      summary: Download the converted WAV (valid for the engine process's lifetime)
      parameters: [ { name: out_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: wav, content: { audio/wav: { schema: { type: string, format: binary } } } }
        "404": { description: out_id unknown or process restarted }

  /api/marketplace:
    get:
      summary: |
        Phase 5 — list approved marketplace listings. Pending listings are NOT
        included (use /api/marketplace/pending for the review queue). Returns
        MarketplaceListing[].
      responses:
        "200": { description: list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MarketplaceListing" } } } } }

  /api/marketplace/pending:
    get:
      summary: |
        Phase 5 — list pending listings awaiting manual review (the review
        queue). Approved/rejected listings are NOT included.
      responses:
        "200": { description: list, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MarketplaceListing" } } } } }

  /api/marketplace/publish:
    post:
      summary: |
        Phase 5 — publish a consented character to the marketplace. Consent-
        gated via the same _enforce_consent_gate as live, async render, and
        voice — the consent_token's face_hash must match the character's
        bound_face_hash. The character PNG + metadata are COPIED into an
        immutable listing; the publisher's bound_face_hash is recorded as an
        audit trail. At publish time the engine computes a 64-bit pHash of
        the PNG and compares it against every approved listing; near-
        duplicates are flagged and stay pending, unflagged listings auto-
        approve.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/PublishRequest" } }
      responses:
        "200": { description: listing, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceListing" } } } }
        "403": { description: consent gate refused (locked char or token face_hash mismatch) }
        "404": { description: character not found }

  /api/marketplace/{listing_id}/thumbnail:
    get:
      summary: Listing character PNG (the image copied at publish time)
      parameters: [ { name: listing_id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: png }, "404": { description: not found } }

  /api/marketplace/{listing_id}/install:
    post:
      summary: |
        Phase 5 — install a marketplace listing into the local registry.
        Creates a NEW unconsented character — the publisher's binding does
        NOT transfer (the installer must run their own liveness to drive it).
        The new character is registered with source=uploaded and an extra
        "marketplace" tag.
      parameters: [ { name: listing_id, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: new character, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }
        "403": { description: listing not approved for install }
        "404": { description: listing or its image not found }

  /api/marketplace/{listing_id}/review:
    post:
      summary: |
        Phase 5 — manual approve/reject a pending listing. The automated
        pHash flag happens at publish time; this endpoint is the manual
        judgment call. status=approved makes the listing installable;
        status=rejected keeps it visible to moderators but uninstallable.
      parameters: [ { name: listing_id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/ReviewActionRequest" } }
      responses:
        "200": { description: updated listing, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceListing" } } } }
        "404": { description: listing not found }
        "409": { description: listing already approved or rejected }

components:
  schemas:
    Character:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string, enum: [stock, generated, uploaded] }
        thumbnail_url: { type: string }
        consented: { type: boolean }
        tags: { type: array, items: { type: string } }
    PoseVector:
      type: object
      description: The only per-frame live message (~250 bytes). NOT a video frame.
      properties:
        ts_ms: { type: integer }
        head: { $ref: "#/components/schemas/HeadPose" }
        left_eye: { $ref: "#/components/schemas/EyeState" }
        right_eye: { $ref: "#/components/schemas/EyeState" }
        mouth: { $ref: "#/components/schemas/MouthState" }
        left_brow: { type: number }
        right_brow: { type: number }
        audio_level: { type: number, nullable: true }
    HeadPose: { type: object, properties: { yaw: {type:number}, pitch: {type:number}, roll: {type:number}, x:{type:number}, y:{type:number}, z:{type:number} } }
    EyeState: { type: object, properties: { blink: {type:number}, pupil_x: {type:number}, pupil_y: {type:number} } }
    MouthState: { type: object, properties: { open: {type:number}, smile: {type:number}, pucker: {type:number} } }
    StartSessionRequest:
      type: object
      properties:
        character_id: { type: string }
        output: { type: string, enum: [virtual_cam, preview, file] }
        consent_token: { type: string, nullable: true }
    StartSessionResponse:
      type: object
      properties:
        session_id: { type: string }
        ws_url: { type: string }
        character: { $ref: "#/components/schemas/Character" }
        output: { type: string, enum: [virtual_cam, preview, file] }
        capabilities: { type: object, additionalProperties: { type: boolean } }
    FrameStats:
      type: object
      properties:
        type: { type: string, enum: [stats] }
        fps_in: { type: number }
        fps_out: { type: number }
        infer_ms: { type: number }
        queue_depth: { type: integer }
        dropped_stale: { type: integer }
        budget_warning: { type: boolean }
    RenderRequest:
      type: object
      properties:
        character_id: { type: string }
        driver: { type: string, enum: [audio, video] }
        driver_url: { type: string }
        quality: { type: string, enum: [draft, high] }
        consent_token: { type: string, nullable: true }
    RenderJob:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string, enum: [queued, running, rendering, done, failed] }
        progress: { type: number }
        download_url: { type: string, nullable: true }
        error: { type: string, nullable: true }
    LivenessChallenge:
      type: object
      properties:
        challenge_id: { type: string }
        steps: { type: array, items: { type: string } }
        issued_at: { type: integer }
    LivenessResult:
      type: object
      properties:
        challenge_id: { type: string }
        passed: { type: boolean }
        consent_token: { type: string, nullable: true, description: "HMAC-signed token; null when passed=false. Mirrors models.py: consent_token: str | None = None" }
        reason: { type: string, nullable: true }
    LivenessVerifyRequest:
      type: object
      description: |
        Client payload to /api/consent/liveness/verify. detected_steps is the
        ordered list of challenge steps the client detected; landmark_evidence
        is the captured face evidence (deterministically hashed into the
        consent token).
      properties:
        challenge_id: { type: string }
        detected_steps: { type: array, items: { type: string } }
        landmark_evidence:
          oneOf:
            - type: object
            - type: array
    GenProviderInfo:
      type: object
      description: Phase 2 — provider metadata for the character-gen selector.
      properties:
        id: { type: string }
        byok: { type: boolean }
        requires_key: { type: boolean }
        label: { type: string }
    GenerateCharacterRequest:
      type: object
      description: Phase 2 — text prompt to anime character (BYOK).
      properties:
        prompt: { type: string }
        name: { type: string }
        provider: { type: string, default: demo }
        api_key: { type: string, nullable: true }
    TransferCharacterRequest:
      type: object
      description: Phase 2 — selfie to anime character (description-based, BYOK).
      properties:
        selfie_b64: { type: string }
        name: { type: string }
        provider: { type: string, default: demo }
        api_key: { type: string, nullable: true }
    UploadCharacterRequest:
      type: object
      description: Phase 2 — raw PNG upload (starts consented=false).
      properties:
        name: { type: string }
        image_b64: { type: string }
    ConsentBindRequest:
      type: object
      description: Phase 2 — bind a verified consent_token to a generated/uploaded character.
      properties:
        character_id: { type: string }
        consent_token: { type: string }
    VoiceConvertRequest:
      type: object
      description: |
        Phase 4 — convert audio to the avatar's voice. Async (file in, file
        out). audio_b64 is raw base64 or a data URI; the engine writes it to
        a temp file and runs the configured converter. consent_token is
        required for bound custom characters (same gate as live + async
        render). api_key is required for cloud conversion (BYOK — never
        persisted); ignored by the external-command converter.
      properties:
        character_id: { type: string }
        audio_b64: { type: string }
        consent_token: { type: string, nullable: true }
        api_key: { type: string, nullable: true }
    VoiceConvertResult:
      type: object
      description: |
        On ok=true, download_url points at GET /api/voice/{out_id}/download
        (valid for the engine process's lifetime). On failure the engine
        raises HTTPException (503/403/502/400) rather than returning ok=false.
      properties:
        ok: { type: boolean }
        download_url: { type: string, nullable: true }
        error: { type: string, nullable: true }
    MarketplaceListing:
      type: object
      description: |
        Phase 5 — a published character pack. The character image + metadata
        are COPIED into the listing at publish time; the listing is immutable
        after that. The publisher's bound_face_hash is recorded on the listing
        as an audit trail (who published this) but does NOT transfer to
        installers — installing creates a NEW unconsented character.
      properties:
        listing_id: { type: string }
        publisher_id: { type: string }
        character_name: { type: string }
        character_tags: { type: array, items: { type: string } }
        thumbnail_url: { type: string, description: "/api/marketplace/{listing_id}/thumbnail" }
        review_status: { type: string, enum: [pending, approved, rejected] }
        flagged: { type: boolean, description: "True when the publish-time pHash near-duplicate check flagged this listing." }
        flag_reason: { type: string, nullable: true, description: "Engine explanation when flagged (e.g. near-duplicate Hamming distance)." }
        published_at: { type: integer, description: "ms epoch" }
        reviewed_at: { type: integer, nullable: true }
        reviewer_id: { type: string, nullable: true }
    PublishRequest:
      type: object
      description: |
        Phase 5 — publish a consented character. The consent_token must match
        the character's bound_face_hash (only the creator who bound it can
        publish it). The bound_face_hash is recorded on the listing as an
        audit trail but does NOT transfer to installers.
      properties:
        character_id: { type: string }
        publisher_id: { type: string }
        consent_token: { type: string }
    ReviewActionRequest:
      type: object
      description: |
        Phase 5 — manual approve/reject a pending listing. The automated pHash
        flag happens at publish time (see marketplace/review.py). status=
        approved makes the listing installable; rejected keeps it visible to
        moderators but uninstallable. The engine returns 409 if the listing
        isn't currently pending.
      properties:
        status: { type: string, enum: [approved, rejected] }
        reviewer_id: { type: string }
        reason: { type: string, nullable: true }
